name: Python smoke test

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q automation/generator tools
      - run: python automation/generator/generate.py examples/demo_no_mpls.xlsx
      - run: python tools/summarize_site_config.py --site 1
